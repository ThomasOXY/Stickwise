[package]
name = "rbx-app"
description = "Stickwise desktop app"
edition.workspace = true
version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pioneer-formats.workspace = true
usb-tools.workspace = true
analysis.workspace = true
analyzer.workspace = true
library.workspace = true
engine-library.workspace = true
libc = "0.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
