[package]
name = "rbx-app"
description = "Stickwise desktop app"
edition.workspace = true
version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pioneer-formats.workspace = true
usb-tools.workspace = true
analysis.workspace = true
analyzer.workspace = true
library.workspace = true
engine-library.workspace = true
peerlink.workspace = true
libsync.workspace = true
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
tempfile = "3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
i18n = { path = "../../crates/i18n" }
