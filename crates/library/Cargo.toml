[package]
name = "library"
description = "Stickwise local library: tracks, playlists, sets, cues (SQLite)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
blake3 = "1"
i18n = { path = "../i18n" }
lofty = "0.25.5"
pioneer-formats.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
