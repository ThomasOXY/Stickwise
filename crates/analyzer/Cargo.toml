[package]
name = "analyzer"
description = "Audio analysis of new tracks: decoding, waveforms, beat grid, key, written as rekordbox ANLZ files"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
beat-this = { version = "1.1", default-features = false }
i18n = { path = "../i18n" }
pioneer-formats.workspace = true
rustfft = "6.4.1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "aiff", "alac"] }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
