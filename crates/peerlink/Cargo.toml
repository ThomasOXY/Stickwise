[package]
name = "peerlink"
description = "Stickwise on other Macs: finding them on the network, pairing, encrypted connections"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
blake3 = "1"
mdns-sd = "0.21"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
