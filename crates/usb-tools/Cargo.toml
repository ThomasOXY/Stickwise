[package]
name = "usb-tools"
description = "USB stick tools: extract playlists to folders, clone, verify"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
pioneer-formats.workspace = true
engine-library.workspace = true
i18n = { path = "../i18n" }
thiserror.workspace = true
unicode-normalization = "0.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.5"
# Artwork thumbnails for the stick.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }

[dev-dependencies]
tempfile = "3"
rusqlite = "0.32"
image = { version = "0.25", default-features = false, features = ["png"] }
engine-library.workspace = true
