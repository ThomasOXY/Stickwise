[workspace]
resolver = "2"
members = ["crates/i18n", "crates/pioneer-formats", "crates/usb-tools", "crates/analysis", "crates/analyzer", "crates/library", "crates/engine-library", "crates/peerlink", "crates/libsync", "cli", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.7.0"
license = "MIT"

[workspace.dependencies]
pioneer-formats = { path = "crates/pioneer-formats" }
usb-tools = { path = "crates/usb-tools" }
analysis = { path = "crates/analysis" }
analyzer = { path = "crates/analyzer" }
library = { path = "crates/library" }
engine-library = { path = "crates/engine-library" }
peerlink = { path = "crates/peerlink" }
libsync = { path = "crates/libsync" }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
