[workspace]
resolver = "2"
members = ["crates/pioneer-formats", "crates/usb-tools", "crates/analysis", "crates/library", "cli", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
pioneer-formats = { path = "crates/pioneer-formats" }
usb-tools = { path = "crates/usb-tools" }
analysis = { path = "crates/analysis" }
library = { path = "crates/library" }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
